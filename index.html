<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>シナモンのそらとぶだいぼうけん</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #87CEEB;
    font-family: 'Hiragino Maru Gothic ProN', 'BIZ UDGothic', 'Rounded Mplus 1c', sans-serif;
    touch-action: none;
  }
  #game-container {
    position: relative;
    width: 100%; height: 100%;
    display: flex; justify-content: center; align-items: center;
  }
  canvas {
    display: block;
    box-shadow: 0 0 40px rgba(0,0,0,0.2);
    border-radius: 8px;
    max-width: 100%;
    max-height: 100%;
  }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game" width="480" height="640"></canvas>
</div>
<script>
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// ---- ゲーム状態 ----
const STATE = { TITLE: 0, PLAYING: 1, GAMEOVER: 2 };
let state = STATE.TITLE;
let score = 0;
let best = Number(localStorage.getItem('cinna-best') || 0);
let frame = 0;
let gameSpeed = 2.2;

// ---- プレイヤー(シナモン)----
const player = {
  x: 120, y: H / 2,
  vy: 0,
  size: 30,          // 当たり判定の半径
  flapAnim: 0,       // 羽ばたきアニメ用
  angle: 0,
  invincible: 0,     // 無敵時間(被弾後)
  lives: 3,
};

const GRAVITY = 0.32;
const FLAP = -6.2;
const MAX_FALL = 7;

// ---- オブジェクト ----
let stars = [];      // 集める星
let clouds = [];     // 背景の雲
let obstacles = [];  // 雨雲(障害物)
let particles = [];  // エフェクト
let rolls = [];      // シナモンロール(ボーナス)

// ---- 効果音(WebAudio・素材不要)----
let audioCtx = null;
function beep(freq, dur, type = 'sine', vol = 0.15) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) { /* 音が出なくてもゲームは続行 */ }
}
function sfxFlap()  { beep(520, 0.08, 'triangle', 0.08); }
function sfxStar()  { beep(880, 0.12, 'sine'); setTimeout(() => beep(1320, 0.15, 'sine'), 60); }
function sfxRoll()  { beep(660, 0.1, 'sine'); setTimeout(() => beep(880, 0.1, 'sine'), 70); setTimeout(() => beep(1100, 0.2, 'sine'), 140); }
function sfxHit()   { beep(180, 0.3, 'sawtooth', 0.12); }
function sfxOver()  { beep(440, 0.2, 'triangle'); setTimeout(() => beep(330, 0.2, 'triangle'), 180); setTimeout(() => beep(220, 0.4, 'triangle'), 360); }

// ---- 入力 ----
function flap() {
  if (state === STATE.TITLE) {
    startGame();
    return;
  }
  if (state === STATE.GAMEOVER) {
    if (frame - gameOverFrame > 30) backToTitle();
    return;
  }
  player.vy = FLAP;
  player.flapAnim = 10;
  sfxFlap();
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    flap();
  }
});
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  flap();
});

// ---- ゲーム制御 ----
let gameOverFrame = 0;

function startGame() {
  state = STATE.PLAYING;
  score = 0;
  gameSpeed = 2.2;
  player.y = H / 2;
  player.vy = 0;
  player.lives = 3;
  player.invincible = 0;
  stars = [];
  obstacles = [];
  rolls = [];
  particles = [];
}

function backToTitle() {
  state = STATE.TITLE;
}

function gameOver() {
  state = STATE.GAMEOVER;
  gameOverFrame = frame;
  if (score > best) {
    best = score;
    localStorage.setItem('cinna-best', best);
  }
  sfxOver();
}

// ---- 生成 ----
function spawnCloud() {
  clouds.push({
    x: W + 80,
    y: Math.random() * H,
    scale: 0.5 + Math.random() * 1.2,
    speed: 0.3 + Math.random() * 0.5,
  });
}

function spawnStar() {
  stars.push({
    x: W + 30,
    y: 60 + Math.random() * (H - 120),
    r: 14,
    spin: Math.random() * Math.PI,
  });
}

function spawnRoll() {
  rolls.push({
    x: W + 30,
    y: 60 + Math.random() * (H - 120),
    r: 16,
    bob: Math.random() * Math.PI * 2,
  });
}

function spawnObstacle() {
  obstacles.push({
    x: W + 60,
    y: 50 + Math.random() * (H - 100),
    r: 32 + Math.random() * 18,
    bobPhase: Math.random() * Math.PI * 2,
    bobAmp: 20 + Math.random() * 30,
    baseY: 0,
  });
  const o = obstacles[obstacles.length - 1];
  o.baseY = o.y;
}

// ---- パーティクル ----
function burst(x, y, color, n = 10) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 1 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 30 + Math.random() * 20,
      maxLife: 50,
      color,
      r: 2 + Math.random() * 3,
    });
  }
}

// ---- 描画:シナモン ----
function drawCinnamoroll(x, y, angle, flapT) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);

  // 無敵中は点滅
  if (player.invincible > 0 && Math.floor(frame / 4) % 2 === 0) {
    ctx.globalAlpha = 0.4;
  }

  const earFlap = Math.sin(flapT * 0.6) * 0.45; // 耳の羽ばたき
  const OUTLINE = 'rgba(150, 172, 200, 0.65)'; // やわらかい水色の輪郭線

  function softShape(drawPath, fill = '#ffffff') {
    ctx.beginPath();
    drawPath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = OUTLINE;
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // しっぽ(ぷっくりしたシナモンロールのうずまき)
  ctx.save();
  ctx.translate(-38, 16);
  softShape(() => ctx.arc(0, 0, 9, 0, Math.PI * 2));
  ctx.strokeStyle = 'rgba(150, 172, 200, 0.55)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let t = 0; t < Math.PI * 4; t += 0.25) {
    const r = (t / (Math.PI * 4)) * 6.5;
    const px = Math.cos(t) * r;
    const py = Math.sin(t) * r;
    if (t === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.restore();

  // 後ろの耳(長い耳が翼のように後ろへひろがってはためく・少し影色)
  ctx.save();
  ctx.translate(-6, -12);
  ctx.rotate(-1.35 + earFlap * 0.9);
  softShape(() => ctx.ellipse(-3, -25, 13, 31, -0.1, 0, Math.PI * 2), '#e9eff9');
  ctx.restore();

  // 体(頭にくらべてちいさくぷっくり)
  softShape(() => ctx.ellipse(-20, 16, 16, 11, 0.15, 0, Math.PI * 2));

  // 後ろ足・前足(短くてまるい)
  softShape(() => ctx.ellipse(-28, 25, 6.5, 4.5, 0.3, 0, Math.PI * 2));
  softShape(() => ctx.ellipse(-8, 27, 6.5, 4.5, -0.2, 0, Math.PI * 2));

  // 頭(横にひろい大きなまるい頭)
  softShape(() => ctx.ellipse(2, 0, 27, 23, 0, 0, Math.PI * 2));

  // 前の耳(顔より長い大きな耳・翼のようにはためく)
  ctx.save();
  ctx.translate(12, -12);
  ctx.rotate(-0.95 + earFlap);
  softShape(() => ctx.ellipse(-2, -27, 14, 33, 0.1, 0, Math.PI * 2));
  ctx.restore();

  // ほっぺ(はっきりめのピンクの楕円・目の下の外側)
  ctx.fillStyle = '#ffc2d4';
  ctx.beginPath();
  ctx.ellipse(-16, 9, 5.5, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(21, 9, 5.5, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // 目(こい青のたて長の楕円・顔の下のほうに離して配置)
  ctx.fillStyle = '#28366b';
  ctx.beginPath();
  ctx.ellipse(-9, 2, 3, 4.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(15, 2, 3, 4.5, 0, 0, Math.PI * 2);
  ctx.fill();
  // 目のハイライト
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-8, 0.5, 1.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(16, 0.5, 1.3, 0, Math.PI * 2);
  ctx.fill();

  // 口(目のあいだの下にちいさなにっこり)
  ctx.strokeStyle = '#28366b';
  ctx.lineWidth = 1.6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(3, 8, 3.2, 0.25, Math.PI - 0.25);
  ctx.stroke();

  ctx.restore();
  ctx.globalAlpha = 1;
}

// ---- 描画:背景 ----
function drawBackground() {
  // 空のグラデーション
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#8ed6f5');
  g.addColorStop(0.6, '#bfe8fa');
  g.addColorStop(1, '#e8f7ff');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 太陽
  ctx.fillStyle = 'rgba(255, 240, 180, 0.9)';
  ctx.beginPath();
  ctx.arc(W - 70, 80, 36, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255, 240, 180, 0.3)';
  ctx.beginPath();
  ctx.arc(W - 70, 80, 50, 0, Math.PI * 2);
  ctx.fill();
}

function drawCloud(c) {
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.scale(c.scale, c.scale);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.arc(0, 0, 20, 0, Math.PI * 2);
  ctx.arc(22, -6, 16, 0, Math.PI * 2);
  ctx.arc(44, 0, 18, 0, Math.PI * 2);
  ctx.arc(22, 8, 18, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ---- 描画:雨雲(障害物)----
function drawObstacle(o) {
  ctx.save();
  ctx.translate(o.x, o.y);
  const s = o.r / 32;
  ctx.scale(s, s);

  // 雲本体(暗い色)
  ctx.fillStyle = '#7a8aa0';
  ctx.beginPath();
  ctx.arc(0, 0, 22, 0, Math.PI * 2);
  ctx.arc(24, -6, 18, 0, Math.PI * 2);
  ctx.arc(46, 0, 20, 0, Math.PI * 2);
  ctx.arc(24, 10, 20, 0, Math.PI * 2);
  ctx.fill();

  // 怒り顔
  ctx.strokeStyle = '#4a5568';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  // 眉
  ctx.beginPath();
  ctx.moveTo(8, -8); ctx.lineTo(18, -4);
  ctx.moveTo(38, -8); ctx.lineTo(28, -4);
  ctx.stroke();
  // 目
  ctx.fillStyle = '#4a5568';
  ctx.beginPath(); ctx.arc(16, 2, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(30, 2, 3, 0, Math.PI * 2); ctx.fill();
  // 口
  ctx.beginPath();
  ctx.arc(23, 16, 6, Math.PI + 0.3, -0.3);
  ctx.stroke();

  // 雨粒
  ctx.fillStyle = 'rgba(120, 160, 220, 0.8)';
  for (let i = 0; i < 3; i++) {
    const dy = ((frame * 2 + i * 20) % 40);
    ctx.beginPath();
    ctx.ellipse(8 + i * 16, 30 + dy, 2.5, 5, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// ---- 描画:星 ----
function drawStar(s) {
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.spin);
  ctx.fillStyle = '#ffd94d';
  ctx.strokeStyle = '#f0b400';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = (i * 4 * Math.PI) / 5 - Math.PI / 2;
    const px = Math.cos(a) * s.r;
    const py = Math.sin(a) * s.r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

// ---- 描画:シナモンロール ----
function drawRoll(r) {
  const bobY = Math.sin(r.bob) * 6;
  ctx.save();
  ctx.translate(r.x, r.y + bobY);
  // ロール本体
  ctx.fillStyle = '#e8b06a';
  ctx.beginPath();
  ctx.arc(0, 0, r.r, 0, Math.PI * 2);
  ctx.fill();
  // うずまき
  ctx.strokeStyle = '#b97b3c';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (let t = 0; t < Math.PI * 4; t += 0.2) {
    const rr = (t / (Math.PI * 4)) * (r.r - 4);
    const px = Math.cos(t) * rr;
    const py = Math.sin(t) * rr;
    if (t === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
  // キラキラ
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.beginPath();
  ctx.arc(-r.r * 0.4, -r.r * 0.4, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ---- 描画:UI ----
function drawHearts() {
  for (let i = 0; i < 3; i++) {
    const x = 20 + i * 32;
    const y = 28;
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = i < player.lives ? '#ff6b9d' : 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.moveTo(0, 4);
    ctx.bezierCurveTo(-12, -8, -12, 6, 0, 14);
    ctx.bezierCurveTo(12, 6, 12, -8, 0, 4);
    ctx.fill();
    ctx.restore();
  }
}

function drawScore() {
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = 'rgba(30,58,95,0.6)';
  ctx.lineWidth = 4;
  ctx.font = 'bold 32px sans-serif';
  ctx.textAlign = 'right';
  ctx.strokeText(score, W - 20, 44);
  ctx.fillText(score, W - 20, 44);
}

function drawCenteredText(text, y, size, color = '#fff', strokeColor = 'rgba(30,58,95,0.7)') {
  ctx.font = `bold ${size}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.strokeStyle = strokeColor;
  ctx.lineWidth = size / 7;
  ctx.lineJoin = 'round';
  ctx.strokeText(text, W / 2, y);
  ctx.fillStyle = color;
  ctx.fillText(text, W / 2, y);
}

// ---- 更新 ----
function update() {
  frame++;

  // 背景の雲
  if (frame % 90 === 0) spawnCloud();
  clouds.forEach(c => c.x -= c.speed * gameSpeed);
  clouds = clouds.filter(c => c.x > -120);

  if (state !== STATE.PLAYING) {
    // タイトル/ゲームオーバー中はふわふわ浮かせる
    player.flapAnim += 0.3;
    return;
  }

  // 難易度上昇
  gameSpeed = 2.2 + Math.min(score * 0.03, 2.5);

  // プレイヤー物理
  player.vy = Math.min(player.vy + GRAVITY, MAX_FALL);
  player.y += player.vy;
  player.angle = Math.max(-0.4, Math.min(0.5, player.vy * 0.06));
  player.flapAnim += player.vy < 0 ? 0.8 : 0.25;
  if (player.invincible > 0) player.invincible--;

  // 画面端
  if (player.y < player.size) { player.y = player.size; player.vy = 0; }
  if (player.y > H - player.size) {
    player.y = H - player.size;
    player.vy = FLAP * 0.6; // 地面でぽよんと跳ねる
  }

  // 生成
  if (frame % 70 === 0) spawnStar();
  if (frame % 320 === 0) spawnRoll();
  if (frame % Math.max(110 - score, 55) === 0) spawnObstacle();

  // 星
  stars.forEach(s => { s.x -= gameSpeed; s.spin += 0.05; });
  stars = stars.filter(s => {
    if (Math.hypot(s.x - player.x, s.y - player.y) < s.r + player.size) {
      score += 1;
      burst(s.x, s.y, '#ffd94d', 8);
      sfxStar();
      return false;
    }
    return s.x > -30;
  });

  // シナモンロール(+5点)
  rolls.forEach(r => { r.x -= gameSpeed; r.bob += 0.08; });
  rolls = rolls.filter(r => {
    if (Math.hypot(r.x - player.x, r.y - player.y) < r.r + player.size) {
      score += 5;
      burst(r.x, r.y, '#e8b06a', 14);
      sfxRoll();
      return false;
    }
    return r.x > -30;
  });

  // 障害物
  obstacles.forEach(o => {
    o.x -= gameSpeed * 1.1;
    o.bobPhase += 0.03;
    o.y = o.baseY + Math.sin(o.bobPhase) * o.bobAmp;
  });
  obstacles = obstacles.filter(o => {
    // 当たり判定(雲の中心はやや右寄り)
    const cx = o.x + o.r * 0.7;
    if (player.invincible <= 0 &&
        Math.hypot(cx - player.x, o.y - player.y) < o.r + player.size * 0.7) {
      player.lives--;
      player.invincible = 90;
      burst(player.x, player.y, '#7a8aa0', 12);
      sfxHit();
      if (player.lives <= 0) gameOver();
    }
    return o.x > -120;
  });

  // パーティクル
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.05;
    p.life--;
  });
  particles = particles.filter(p => p.life > 0);
}

// ---- 描画メイン ----
function draw() {
  drawBackground();
  clouds.forEach(drawCloud);

  if (state === STATE.PLAYING || state === STATE.GAMEOVER) {
    stars.forEach(drawStar);
    rolls.forEach(drawRoll);
    obstacles.forEach(drawObstacle);
  }

  // パーティクル
  particles.forEach(p => {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  if (state === STATE.TITLE) {
    // タイトル画面:ふわふわ浮くシナモン
    const bobY = Math.sin(frame * 0.05) * 12;
    drawCinnamoroll(W / 2, H / 2 + bobY - 40, 0, player.flapAnim);
    drawCenteredText('シナモンの', 150, 36);
    drawCenteredText('そらとぶだいぼうけん', 200, 36);
    drawCenteredText('⭐ ほしをあつめよう ⭐', H / 2 + 90, 20, '#fff7cc');
    drawCenteredText('あまぐもにきをつけて!', H / 2 + 124, 20, '#fff7cc');
    if (Math.floor(frame / 30) % 2 === 0) {
      drawCenteredText('タップ / スペースキーでスタート', H - 80, 22);
    }
    if (best > 0) {
      drawCenteredText(`ベストスコア: ${best}`, H - 36, 18, '#fff7cc');
    }
  } else {
    drawCinnamoroll(player.x, player.y, player.angle, player.flapAnim);
    drawHearts();
    drawScore();
  }

  if (state === STATE.GAMEOVER) {
    ctx.fillStyle = 'rgba(30, 58, 95, 0.45)';
    ctx.fillRect(0, 0, W, H);
    drawCenteredText('おつかれさま!', H / 2 - 80, 40);
    drawCenteredText(`スコア: ${score}`, H / 2 - 10, 32, '#ffd94d');
    drawCenteredText(`ベスト: ${best}`, H / 2 + 40, 24, '#fff7cc');
    if (frame - gameOverFrame > 30 && Math.floor(frame / 30) % 2 === 0) {
      drawCenteredText('タップでタイトルへ', H / 2 + 110, 22);
    }
  }
}

// ---- メインループ ----
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// 初期の雲を配置
for (let i = 0; i < 5; i++) {
  clouds.push({
    x: Math.random() * W,
    y: Math.random() * H,
    scale: 0.5 + Math.random() * 1.2,
    speed: 0.3 + Math.random() * 0.5,
  });
}

loop();
</script>
</body>
</html>
